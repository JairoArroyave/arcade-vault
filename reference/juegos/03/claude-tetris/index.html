<!doctype html>
<html lang="es" data-theme="dark" data-skin="retro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="header">
        <h1 class="app-title">TETRIS</h1>
        <select
          id="skin-select"
          class="skin-select"
          title="Cambiar skin visual"
        >
          <option value="retro">Retro</option>
          <option value="neon">Neon</option>
          <option value="pastel">Pastel</option>
          <option value="pixel">Pixel art</option>
        </select>
        <label class="theme-toggle" title="Cambiar tema claro/oscuro">
          <input type="checkbox" id="theme-switch" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="game-container">
        <canvas id="board" width="300" height="600"></canvas>

        <aside class="panel">
          <div class="panel-section">
            <span class="label">SCORE</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>

          <div class="panel-section">
            <span class="label">NEXT</span>
            <canvas id="next-canvas" width="120" height="120"></canvas>
          </div>

          <div class="panel-section controls">
            <span class="label">CONTROLS</span>
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
          </div>
        </aside>
      </div>

      <div id="start-overlay" class="overlay">
        <div class="overlay-box records-box">
          <p class="overlay-heading">TETRIS</p>
          <div id="start-records" class="records-section"></div>
          <button id="play-btn">Jugar</button>
        </div>
      </div>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box records-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="name-entry" class="name-entry hidden">
            <input
              type="text"
              id="player-name"
              maxlength="12"
              placeholder="Tu nombre"
              autocomplete="off"
            />
            <button id="save-record-btn">Guardar</button>
          </div>
          <div id="gameover-records" class="records-section hidden"></div>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>

      <div id="pause-overlay" class="overlay hidden">
        <div class="overlay-box pause-box">
          <p class="pause-title">PAUSA</p>

          <div id="pause-menu-main" class="pause-menu">
            <button id="resume-btn" class="menu-btn menu-btn-primary">
              Reanudar
            </button>
            <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
            <button id="show-controls-btn" class="menu-btn">
              Ver controles
            </button>

            <div class="level-select">
              <label for="start-level">Nivel inicial</label>
              <select id="start-level"></select>
            </div>
          </div>

          <div id="pause-controls-view" class="pause-controls hidden">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
            <button id="back-to-menu-btn" class="menu-btn">Volver</button>
          </div>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
